name: Community governance tests

on:
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/community-governance-tests.yml"
      - ".github/workflows/linked-issue*.yml"
      - "governance/**"
      - "scripts/community_governance.py"
      - "scripts/validate_linked_issue.py"
      - "templates/**"
      - "tests/community/**"
      - "wiki-templates/**"
  push:
    branches: [master]
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/community-governance-tests.yml"
      - ".github/workflows/linked-issue*.yml"
      - "governance/**"
      - "scripts/community_governance.py"
      - "scripts/validate_linked_issue.py"
      - "templates/**"
      - "tests/community/**"
      - "wiki-templates/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema PyYAML
      - run: python -m unittest discover -s tests/community -v

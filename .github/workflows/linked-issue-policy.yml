name: Reusable linked issue policy

# Scope (recorded 2026-10-10): this policy grades OPEN PULL REQUESTS only.
# It requires a linked same-repository closing issue on every open PR. It
# does NOT grade direct pushes to a default branch — a push to master/main
# never triggers this check, so a red "Linked issue policy" on a PR says
# nothing about the health of the branch it targets. (Verified 2026-10-10:
# embeddedos-org/eos#192 failed this policy on the PR while eos master
# stayed fully green; the failure was the PR's missing linked issue, as
# designed — the author had committed to a feature branch, not master.)

on:
  workflow_call:
    inputs:
      policy_ref:
        description: Full commit SHA in embeddedos-org/.github containing the reviewed policy
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    name: Policy / Linked Issue
    # pull_request_target also fires on `edited` for closed and merged pull
    # requests, so editing the body of a PR merged before this policy existed
    # graded it against the policy and failed it. A merged PR cannot be
    # changed to satisfy the policy, and grading it says nothing about the
    # tree. Only an open PR is a decision still to be made. Guarding here, on
    # the reusable job, so every caller gets it when its `uses:` pin is
    # bumped (fixes #8).
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an immutable policy reference
        env:
          POLICY_REF: ${{ inputs.policy_ref }}
        shell: bash
        run: |
          if [[ ! "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "policy_ref must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - name: Check out reviewed policy only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: embeddedos-org/.github
          ref: ${{ inputs.policy_ref }}
          path: policy
          persist-credentials: false

      - name: Validate same-repository closing issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 policy/scripts/validate_linked_issue.py
          --event "$GITHUB_EVENT_PATH"
          --registry policy/governance/repositories.json

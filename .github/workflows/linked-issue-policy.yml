name: Reusable linked issue policy

on:
  workflow_call:
    inputs:
      policy_ref:
        description: Full commit SHA in embeddedos-org/.github containing the reviewed policy
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    name: Policy / Linked Issue
    # Callers trigger on pull_request_target for [opened, edited, reopened,
    # synchronize], and `edited` fires on closed and merged pull requests
    # too. A merged PR cannot be changed to satisfy this policy, and grading
    # it says nothing about the tree -- on 2026-09-14 a round of body edits
    # on already-merged PRs produced 50 failing runs across three repos,
    # every one on a merged or closed branch. Only an open PR is a decision
    # still to be made. `github.event` here is the caller's event.
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require an immutable policy reference
        env:
          POLICY_REF: ${{ inputs.policy_ref }}
        shell: bash
        run: |
          if [[ ! "$POLICY_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "policy_ref must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - name: Check out reviewed policy only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: embeddedos-org/.github
          ref: ${{ inputs.policy_ref }}
          path: policy
          persist-credentials: false

      - name: Validate same-repository closing issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 policy/scripts/validate_linked_issue.py
          --event "$GITHUB_EVENT_PATH"
          --registry policy/governance/repositories.json
